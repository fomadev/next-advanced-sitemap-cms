name: Release CMS Package & Publish to NPM

on:
  push:
    tags:
      - 'v*' # Se déclenche à chaque push de tag spécifique au CMS (ex: cms-v1.0.0) ou 'v*' universel

jobs:
  publish-cms:
    name: Build, Release & Publish CMS
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./next-advanced-sitemap-cms

    permissions:
      contents: write # Requis pour créer la release GitHub et y attacher le zip
      id-token: write # Requis pour la publication NPM sécurisée

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test

      - name: Build production artifact
        run: npm run build

      # ÉTAPE 1 : Archivage du dossier dist/ au format ZIP
      - name: Create Production Distribution Artifact (ZIP)
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "Version détectée : $TAG_VERSION"
          zip -r "next-advanced-sitemap-cms-${TAG_VERSION}-dist.zip" dist/
          echo "ZIP_NAME=next-advanced-sitemap-cms-${TAG_VERSION}-dist.zip" >> $GITHUB_ENV

      # ÉTAPE 2 : Création de la Release GitHub automatique et envoi du ZIP
      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CMS Package Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ÉTAPE 3 : Publication finale sur le registre NPM sous l'organisation fomadev
      - name: Publish package to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}